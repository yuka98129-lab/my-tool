<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    header .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    nav a:hover { color: #fff; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }

    .badge {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 2rem;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1.5px;
      max-width: 700px;
      margin-bottom: 1.5rem;
    }

    h1 span {
      background: linear-gradient(135deg, #6ee7f7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #888;
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #6ee7f7, #a78bfa);
      color: #000;
      border: none;
    }

    .btn-secondary {
      background: transparent;
      color: #f0f0f0;
      border: 1px solid #333;
    }

    .btn:hover { opacity: 0.85; }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #444;
      border-top: 1px solid #1a1a1a;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">My Tool</div>
    <nav>
      <a href="#">機能</a>
      <a href="#">料金</a>
      <a href="#">ドキュメント</a>
    </nav>
  </header>

  <main>
    <div class="badge">新登場</div>
    <h1>Hello Vercel</h1>
    <p class="subtitle">My Tool は、日々のタスクを自動化し、チームの生産性を最大化するためのシンプルなツールです。</p>
    <div class="actions">
      <a href="#" class="btn btn-primary">無料で始める</a>
      <a href="#" class="btn btn-secondary">詳しく見る</a>
    </div>
  </main>

  <footer>
    &copy; 2026 My Tool. All rights reserved.
  </footer>

</body>
</html>
